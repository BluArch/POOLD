services:
  - type: cron
    name: poold-costco-langford-refresh
    runtime: docker
    dockerfilePath: ./Dockerfile.costco
    branch: main
    region: oregon
    plan: 0.5c-512mb
    # Render uses UTC. Langford observes UTC-7 year-round.
    schedule: "0 9 * * *"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_SIZE
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
