# Aiven hosts persistent MySQL separately. No expiring Render database is created.
services:
  - type: web
    name: poold
    branch: main
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build:host
    startCommand: npm run start:host
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DEMO_ENABLED
        value: "false"
      - key: FCM_ENABLED
        value: "false"
      - key: STATIC_WEB_DIR
        value: ../mobile/dist
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
      - key: OTP_SECRET
        sync: false
      # Render Free blocks Gmail's 465/587. Brevo supports STARTTLS on 2525.
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
